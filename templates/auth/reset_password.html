{% extends "layout/auth_base.html" %}

{% block title %}Reset Password - Security Compliance{% endblock %}

{% block content %}
<h5 class="fw-bold mb-2 text-center text-dark">Reset Password</h5>
<p class="small text-muted text-center mb-4">Enter a new secure password for your account.</p>

<form action="{{ url_for('reset_password') }}" method="POST">
    <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">New Password</label>
        <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
    </div>

    <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required minlength="6">
    </div>

    <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold mb-3">Update Password</button>
</form>

<div class="text-center border-top pt-3">
    <a href="{{ url_for('login') }}" class="small fw-bold text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
</div>
{% endblock %}
