{% extends "layout/auth_base.html" %}

{% block title %}Forgot Password - Security Compliance{% endblock %}

{% block content %}
<h5 class="fw-bold mb-2 text-center text-secondary">Forgot Password</h5>
<p class="small text-muted text-center mb-4">Enter your account email address. We will send you instructions to reset your password.</p>

<form action="{{ url_for('forgot_password') }}" method="POST">
    <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Email Address</label>
        <div class="input-group">
            <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
            <input type="email" name="email" class="form-control" placeholder="user@company.com" required>
        </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Send Reset Instructions</button>
</form>

<div class="text-center border-top pt-3">
    <a href="{{ url_for('login') }}" class="small fw-bold text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
</div>
{% endblock %}
