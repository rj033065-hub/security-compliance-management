{% extends "layout/auth_base.html" %}

{% block title %}Register - Security Compliance System{% endblock %}

{% block content %}
<h5 class="fw-bold mb-3 text-secondary text-center">Create Employee Account</h5>

<form action="{{ url_for('register') }}" method="POST">
    <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="e.g. John Doe" required>
    </div>

    <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Username</label>
        <input type="text" name="username" class="form-control" placeholder="e.g. john.doe" required>
    </div>

    <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="john@company.com" required>
    </div>

    <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Select Department</label>
        <select name="department_id" class="form-select">
            <option value="">-- Select Department --</option>
            {% for dept in departments %}
                <option value="{{ dept.id }}">{{ dept.name }} ({{ dept.code }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Minimum 8 characters" required minlength="8">
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Register Account</button>
</form>

<div class="text-center border-top pt-3">
    <span class="small text-muted">Already registered?</span>
    <a href="{{ url_for('login') }}" class="small fw-bold text-decoration-none ms-1">Sign In</a>
</div>
{% endblock %}
